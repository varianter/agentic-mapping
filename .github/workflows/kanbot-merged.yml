# kanbot glue: runs on GitHub so it works even when the kanbot machine is off.
# When one approach of an exploratory issue is merged, close the sibling PRs.
name: kanbot merged
on:
  pull_request:
    types: [closed]
permissions:
  contents: write
  pull-requests: write
jobs:
  close-siblings:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'kanbot/')
    runs-on: ubuntu-latest
    steps:
      - name: Close other approaches for the same issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          issue=$(echo "$HEAD" | sed -nE 's#^kanbot/([0-9]+)(-v[0-9]+)?$#\1#p')
          [ -n "$issue" ] || exit 0
          gh pr list --repo "$REPO" --state open --limit 50 --json number,headRefName \
            --jq ".[] | select(.headRefName | test(\"^kanbot/${issue}(-v[0-9]+)?$\")) | .number" |
          while read -r n; do
            gh pr close "$n" --repo "$REPO" --delete-branch \
              --comment "Closed automatically: #$PR was merged for #$issue. <!-- kanbot:sibling-closed -->"
          done
          gh api -X DELETE "repos/$REPO/git/refs/heads/$HEAD" || true
